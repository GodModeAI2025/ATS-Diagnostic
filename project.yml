name: ATSDiagnostic
options:
  bundleIdPrefix: com.mobilebox
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: SP73Z8JWXM
    MARKETING_VERSION: '2.0'
    CURRENT_PROJECT_VERSION: '30'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  ATSDiagnostic:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilebox.atsdiagnostic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ATS Diagnostic
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ATSDiagnosticTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ATSDiagnostic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ATSDiagnostic:
    build:
      targets:
        ATSDiagnostic: all
    test:
      targets: [ATSDiagnosticTests]
