name: ATSDiagnostic
options:
  bundleIdPrefix: com.mobilebox
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: SP73Z8JWXM
    MARKETING_VERSION: '2.0.1'
    CURRENT_PROJECT_VERSION: '58'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  ATSDiagnostic:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Configuration/ATSDiagnostic-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: "ATS Diagnostic prüft von dir ausgewählte Geräte und Server im lokalen Netzwerk, um HTTP, TLS und Zertifikate zu untersuchen."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilebox.atsdiagnostic
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: '15.0'
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Configuration/ATSDiagnostic-Mac.entitlements
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "INFOPLIST_KEY_LSApplicationCategoryType[sdk=macosx*]": public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ATS Diagnostic
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ATSDiagnosticPreview:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Configuration/ATSDiagnosticPreview-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: "ATS Diagnostic prüft von dir ausgewählte Geräte und Server im lokalen Netzwerk, um HTTP, TLS und Zertifikate zu untersuchen."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilebox.atsdiagnostic.preview
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ATS Diagnostic
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  ATSDiagnosticTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ATSDiagnostic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
  ATSDiagnosticLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LiveTests]
    dependencies:
      - target: ATSDiagnostic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ATSDiagnosticProxyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ProxyLiveTests]
    dependencies:
      - target: ATSDiagnostic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ATSDiagnostic:
    build:
      targets:
        ATSDiagnostic: all
    test:
      targets: [ATSDiagnosticTests]
  ATSDiagnosticPreview:
    build:
      targets:
        ATSDiagnosticPreview: all

  ATSDiagnosticBadSSL:
    build:
      targets:
        ATSDiagnostic: all
    test:
      targets: [ATSDiagnosticLiveTests]
  ATSDiagnosticProxy:
    build:
      targets:
        ATSDiagnostic: all
    test:
      targets: [ATSDiagnosticProxyTests]
